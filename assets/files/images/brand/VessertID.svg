<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="#0c0e14" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Geometric 3D Prism Monogram 'V' -->
  <g filter="url(#shadow)">
    <!-- Left Wing of V -->
    <path d="M128 144 L212 144 L256 312 L200 348 Z" fill="url(#grad2)" />
    
    <!-- Right Wing of V -->
    <path d="M384 144 L300 144 L256 312 L312 348 Z" fill="url(#grad3)" />
    
    <!-- Central Prism Vertex / Core -->
    <polygon points="256,312 200,348 256,416 312,348" fill="url(#grad1)" />
    
    <!-- Top Floating Diamond / Axis Marker -->
    <polygon points="256,104 296,144 256,184 216,144" fill="url(#grad4)" />
  </g>
</svg>
