<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Welcome Doorway / Portal & Radiant Glow -->
  <circle cx="300" cy="210" r="140" fill="#6366f1" opacity="0.15"/>
  <rect x="210" y="90" width="180" height="270" rx="24" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" filter="url(#softShadow)"/>
  <path d="M225 105 H375 V360 H225 Z" fill="url(#primaryGrad)" opacity="0.2"/>
  <!-- Welcoming Hand Wave / Open Badge -->
  <circle cx="300" cy="180" r="48" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
  <path d="M290 160 C290 145 300 145 300 165 C305 150 315 152 313 168 C318 156 326 160 324 175 C328 168 333 172 331 185 C328 205 315 212 300 212 C285 212 280 200 280 185 Z" fill="#ffffff"/>
  <!-- Floating Confetti & Sparkles -->
  <polygon points="170,120 180,135 160,135" fill="#f59e0b"/>
  <circle cx="430" cy="130" r="8" fill="#ec4899"/>
  <rect x="140" y="240" width="14" height="14" rx="3" fill="#10b981" transform="rotate(25 140 240)"/>
  <rect x="440" y="260" width="16" height="16" rx="4" fill="#3b82f6" transform="rotate(45 440 260)"/>
  <text x="300" y="320" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Welcome to Vessert</text>
  <text x="300" y="344" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Your creative journey begins here</text>

</svg>