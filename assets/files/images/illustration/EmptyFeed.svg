<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Empty Timeline / Blank Feed Cards -->
  <rect x="180" y="90" width="240" height="250" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" filter="url(#softShadow)"/>
  <!-- Ghost Profile Bar -->
  <circle cx="220" cy="130" r="18" fill="#334155"/>
  <rect x="250" y="122" width="100" height="10" rx="5" fill="#334155"/>
  <rect x="250" y="138" width="60" height="8" rx="4" fill="#1e293b"/>
  <!-- Ghost Image Box -->
  <rect x="202" y="166" width="196" height="100" rx="10" fill="#0f172a"/>
  <!-- Empty Inbox Icon Center -->
  <path d="M280 205 L300 225 L320 205" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Your Feed is Empty</text>
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Follow creators or topics to populate stories</text>

</svg>