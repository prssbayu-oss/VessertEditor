<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Empty Speech Bubble with Sleeping Zzz -->
  <circle cx="300" cy="190" r="100" fill="#334155" opacity="0.15"/>
  <path d="M220 120 H380 C395 120 405 130 405 145 V225 C405 240 395 250 380 250 H270 L220 285 V250 H220 C205 250 195 240 195 225 V145 C195 130 205 120 220 120 Z" fill="#1e293b" stroke="#475569" stroke-width="3" stroke-dasharray="8 6" filter="url(#softShadow)"/>
  <!-- Sleeping 'Z z z' -->
  <text x="270" y="195" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#64748b">Z</text>
  <text x="305" y="175" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#64748b">z</text>
  <text x="330" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748b">z</text>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">No Messages Here</text>
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Start a conversation by searching for friends</text>

</svg>