<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Telescope / Radar / Globe -->
  <circle cx="300" cy="200" r="110" fill="#0ea5e9" opacity="0.12"/>
  <!-- Compass / Radar Rings -->
  <circle cx="300" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Telescope Body -->
  <g transform="translate(300, 200) rotate(-35)">
    <rect x="-80" y="-18" width="160" height="36" rx="10" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
    <rect x="70" y="-24" width="24" height="48" rx="8" fill="#38bdf8"/>
    <rect x="-95" y="-12" width="18" height="24" rx="4" fill="#1e293b"/>
  </g>
  <!-- Tripod Legs -->
  <line x1="300" y1="210" x2="230" y2="360" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="210" x2="300" y2="360" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="210" x2="370" y2="360" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- Star Clusters -->
  <polygon points="440,90 445,102 458,102 448,110 452,122 440,114 428,122 432,110 422,102 435,102" fill="#facc15"/>
  <polygon points="160,110 164,120 174,120 166,126 169,136 160,130 151,136 154,126 146,120 156,120" fill="#facc15"/>
  <text x="300" y="395" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Discover Endless Ideas</text>

</svg>