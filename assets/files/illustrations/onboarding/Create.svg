<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Digital Canvas / Pen Tablet / Creative Workspace -->
  <rect x="180" y="110" width="240" height="170" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Colorful Drawing Artwork on Canvas -->
  <rect x="196" y="126" width="208" height="138" rx="8" fill="#0f172a"/>
  <path d="M210 240 Q 260 160 300 200 T 390 170" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="180" r="18" fill="url(#warnGrad)"/>
  <!-- Stylus / Digital Pen -->
  <g transform="translate(390, 160) rotate(-45)">
    <rect x="-6" y="-60" width="12" height="70" rx="4" fill="#e2e8f0" filter="url(#softShadow)"/>
    <polygon points="-6,10 6,10 0,24" fill="#3b82f6"/>
    <circle cx="0" cy="-30" r="3" fill="#6366f1"/>
  </g>
  <!-- Palette Swatches Below -->
  <circle cx="230" cy="320" r="14" fill="#ef4444"/>
  <circle cx="265" cy="320" r="14" fill="#f59e0b"/>
  <circle cx="300" cy="320" r="14" fill="#10b981"/>
  <circle cx="335" cy="320" r="14" fill="#3b82f6"/>
  <circle cx="370" cy="320" r="14" fill="#8b5cf6"/>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Create Without Limits</text>

</svg>