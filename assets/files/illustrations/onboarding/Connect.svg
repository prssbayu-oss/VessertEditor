<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Interconnected Network Nodes / People -->
  <circle cx="300" cy="200" r="130" fill="#8b5cf6" opacity="0.1"/>
  <!-- Connection Lines -->
  <path d="M190 220 L300 130 L410 220 L300 290 Z" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <line x1="300" y1="130" x2="300" y2="290" stroke="#8b5cf6" stroke-width="3"/>
  <line x1="190" y1="220" x2="410" y2="220" stroke="#8b5cf6" stroke-width="3"/>
  <!-- Nodes / Profile Avatars -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="0" r="32" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="-6" r="12" fill="#ffffff"/>
    <path d="M-16 18 C-16 8 16 8 16 18 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(190, 220)">
    <circle cx="0" cy="0" r="28" fill="url(#accentGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="-5" r="10" fill="#ffffff"/>
    <path d="M-14 16 C-14 7 14 7 14 16 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(410, 220)">
    <circle cx="0" cy="0" r="28" fill="url(#greenGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="-5" r="10" fill="#ffffff"/>
    <path d="M-14 16 C-14 7 14 7 14 16 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(300, 290)">
    <circle cx="0" cy="0" r="26" fill="url(#warnGrad)" filter="url(#softShadow)"/>
    <circle cx="0" cy="-5" r="9" fill="#ffffff"/>
    <path d="M-13 14 C-13 6 13 6 13 14 Z" fill="#ffffff"/>
  </g>
  <text x="300" y="375" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Connect With Creators</text>

</svg>