<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- User Profile Card With Follow Badge -->
  <rect x="180" y="100" width="240" height="230" rx="20" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2" filter="url(#softShadow)"/>
  <!-- Cover Photo Area -->
  <rect x="180" y="100" width="240" height="80" rx="20" fill="url(#primaryGrad)"/>
  <!-- User Avatar -->
  <circle cx="300" cy="180" r="36" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
  <circle cx="300" cy="172" r="16" fill="url(#accentGrad)"/>
  <path d="M280 205 C280 192 320 192 320 205 Z" fill="url(#accentGrad)"/>
  <!-- Follow Button with + -->
  <rect x="230" y="240" width="140" height="36" rx="18" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
  <text x="300" y="264" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Follow</text>
  <!-- Stats row -->
  <text x="250" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">12.4K Followers</text>
  <text x="350" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">340 Following</text>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Follow People You Admire</text>

</svg>