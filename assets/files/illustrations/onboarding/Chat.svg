<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Dialogue Speech Bubbles -->
  <circle cx="300" cy="190" r="120" fill="#6366f1" opacity="0.12"/>
  <!-- Left Received Bubble -->
  <rect x="160" y="110" width="180" height="74" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#softShadow)"/>
  <path d="M160 160 L140 174 L170 174 Z" fill="#1e293b"/>
  <rect x="180" y="130" width="140" height="12" rx="6" fill="#475569"/>
  <rect x="180" y="152" width="90" height="10" rx="5" fill="#334155"/>
  <!-- Right Sent Bubble -->
  <rect x="260" y="200" width="180" height="74" rx="20" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
  <path d="M440 250 L460 264 L430 264 Z" fill="#3b82f6"/>
  <rect x="280" y="220" width="130" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="280" y="242" width="80" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
  <!-- Typing indicator dots -->
  <circle cx="210" cy="305" r="5" fill="#6366f1"/>
  <circle cx="225" cy="305" r="5" fill="#6366f1" opacity="0.6"/>
  <circle cx="240" cy="305" r="5" fill="#6366f1" opacity="0.3"/>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Real-Time Messaging</text>

</svg>