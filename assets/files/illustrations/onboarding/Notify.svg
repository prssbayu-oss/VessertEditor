<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Ringing Bell & Floating Alerts -->
  <circle cx="300" cy="190" r="120" fill="#f59e0b" opacity="0.12"/>
  <!-- Ringing Soundwaves -->
  <path d="M170 160 A 90 90 0 0 1 170 240" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 160 A 90 90 0 0 0 430 240" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Golden Bell Body -->
  <g transform="translate(300, 190) rotate(8)">
    <path d="M-40 40 C-35 10 -30 -30 0 -40 C30 -30 35 10 40 40 Z" fill="url(#warnGrad)" filter="url(#softShadow)"/>
    <rect x="-46" y="38" width="92" height="12" rx="6" fill="#f59e0b"/>
    <!-- Bell Clapper -->
    <circle cx="0" cy="54" r="12" fill="#d97706"/>
    <!-- Top Ring -->
    <circle cx="0" cy="-44" r="8" fill="none" stroke="#f59e0b" stroke-width="4"/>
  </g>
  <!-- Unread Badge with Number -->
  <circle cx="345" cy="140" r="16" fill="#ef4444" filter="url(#softShadow)"/>
  <text x="345" y="146" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="300" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Never Miss an Update</text>

</svg>