<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="100%" stop-color="#1f1212"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>
  <rect width="600" height="450" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Subtle floor shadow and horizon -->
  <ellipse cx="300" cy="390" rx="220" ry="24" fill="#000000" opacity="0.3"/>

  <!-- Glitched Computer Monitor with Question / Spark -->
  <rect x="200" y="130" width="200" height="140" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="216" y="146" width="168" height="108" rx="6" fill="#0f172a"/>
  <!-- Glitch scanlines -->
  <line x1="225" y1="170" x2="375" y2="170" stroke="#ec4899" stroke-width="2"/>
  <line x1="225" y1="210" x2="350" y2="210" stroke="#06b6d4" stroke-width="3"/>
  <polygon points="300,165 310,190 290,195 305,225" fill="#facc15"/>
  <text x="300" y="335" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Unknown Error</text>
  <text x="300" y="360" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">An unexpected issue occurred. Please retry your action</text>

</svg>